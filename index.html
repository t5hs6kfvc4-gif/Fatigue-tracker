<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fatigue">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Fatigue Tracker</title>
  <style>
    :root{
      --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#d1d5db; --accent:#111827;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 90px)}
    h1{font-size:28px;margin:8px 0 2px}
    .sub{color:var(--muted);margin-bottom:16px}
    .card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 8px rgba(0,0,0,.06)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
    input,textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;color:var(--text)}
    textarea{min-height:70px;resize:vertical}
    button{width:100%;border:none;border-radius:14px;padding:13px 14px;font:inherit;font-weight:700;background:var(--accent);color:white;margin-top:10px}
    button.secondary{background:#e5e7eb;color:#111827}
    .score{font-size:34px;font-weight:800;text-align:center}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .pill{background:#eef2f7;border-radius:999px;padding:7px 10px;font-size:13px}
    canvas{width:100%;height:220px;border-radius:12px;background:#fff}
    .history{max-height:340px;overflow:auto}
    .item{padding:10px 0;border-bottom:1px solid #eceff3}
    .item:last-child{border-bottom:none}
    .date{font-weight:700}
    .meta{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
    .tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid #ddd;padding:8px max(10px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));display:flex;gap:8px;z-index:10}
    .tabs button{margin:0;padding:10px;font-size:14px}
    .hide{display:none}
    .tiny{font-size:12px;color:var(--muted)}
    @media(max-width:480px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <section id="logTab">
    <h1>Fatigue Tracker</h1>
    <div class="sub">Post-stroke fatigue, training load, sleep and alcohol</div>

    <div class="card">
      <div class="row">
        <div>
          <label>Date</label>
          <input id="date" type="date">
        </div>
        <div class="pill" id="statusPill">Today</div>
      </div>
    </div>

    <div class="card">
      <h3>11:00 check-in</h3>
      <label>Fatigue 0–10</label>
      <input id="fatigue11" type="number" min="0" max="10" step="1" placeholder="e.g. 7">
    </div>

    <div class="card">
      <h3>21:00 check-in</h3>
      <div class="grid">
        <div>
          <label>Fatigue 0–10</label>
          <input id="fatigue21" type="number" min="0" max="10" step="1" placeholder="e.g. 5">
        </div>
        <div>
          <label>CTL</label>
          <input id="ctl" type="number" step="0.1" placeholder="e.g. 35">
        </div>
        <div>
          <label>Beers today</label>
          <input id="beers" type="number" min="0" step="1" placeholder="0">
        </div>
        <div>
          <label>Sleep last night (hours)</label>
          <input id="sleep" type="number" min="0" max="16" step="0.1" placeholder="e.g. 8.0">
        </div>
      </div>
      <label style="margin-top:12px">Training today</label>
      <textarea id="training" placeholder="e.g. 40 min easy run, 5K parkrun, rest"></textarea>
      <button id="saveBtn">Save / Update Day</button>
      <div class="tiny" style="margin-top:8px">Data stays in this browser on this iPhone.</div>
    </div>
  </section>

  <section id="trendsTab" class="hide">
    <h1>Trends</h1>
    <div class="card">
      <div class="row"><strong>Fatigue</strong><span class="tiny">11:00 and 21:00</span></div>
      <canvas id="fatigueChart" width="680" height="220"></canvas>
    </div>
    <div class="card">
      <div class="row"><strong>CTL</strong><span class="tiny">daily</span></div>
      <canvas id="ctlChart" width="680" height="220"></canvas>
    </div>
  </section>

  <section id="historyTab" class="hide">
    <h1>History</h1>
    <div class="card history" id="history"></div>
    <div class="card">
      <button class="secondary" id="exportBtn">Export JSON Backup</button>
      <button class="secondary" id="csvBtn">Export CSV</button>
      <label style="margin-top:12px">Import JSON backup</label>
      <input id="importFile" type="file" accept="application/json">
      <button class="secondary" id="clearBtn">Clear All Data</button>
    </div>
  </section>
</div>

<div class="tabs">
  <button onclick="showTab('log')">Log</button>
  <button onclick="showTab('trends')">Trends</button>
  <button onclick="showTab('history')">History</button>
</div>

<script>
const KEY='fatigueTrackerDataV1';
const els = id => document.getElementById(id);
const fields=['fatigue11','fatigue21','ctl','beers','sleep','training'];

function todayISO(){
  const d=new Date(); const off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
function loadAll(){ try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}} }
function saveAll(x){ localStorage.setItem(KEY,JSON.stringify(x)); }
function loadDay(date){
  const all=loadAll(), d=all[date]||{};
  fields.forEach(f=>els(f).value = (d[f] ?? ''));
  els('statusPill').textContent = date===todayISO() ? 'Today' : 'Editing';
}
function valNum(id){
  const v=els(id).value.trim();
  return v==='' ? null : Number(v);
}
function saveDay(){
  const date=els('date').value;
  if(!date) return;
  const all=loadAll();
  all[date]={
    fatigue11:valNum('fatigue11'),
    fatigue21:valNum('fatigue21'),
    ctl:valNum('ctl'),
    beers:valNum('beers'),
    sleep:valNum('sleep'),
    training:els('training').value.trim()
  };
  saveAll(all);
  renderHistory(); drawCharts();
  els('statusPill').textContent='Saved';
  setTimeout(()=>els('statusPill').textContent=date===todayISO()?'Today':'Editing',1200);
}
els('saveBtn').addEventListener('click',saveDay);
els('date').addEventListener('change',e=>loadDay(e.target.value));
els('date').value=todayISO(); loadDay(todayISO());

function showTab(name){
  ['log','trends','history'].forEach(n=>els(n+'Tab').classList.toggle('hide',n!==name));
  if(name==='trends') drawCharts();
  if(name==='history') renderHistory();
}
function renderHistory(){
  const all=loadAll(), dates=Object.keys(all).sort().reverse();
  els('history').innerHTML = dates.length ? dates.map(date=>{
    const d=all[date];
    return `<div class="item"><div class="date">${date}</div>
      <div class="meta">11:00 fatigue: ${d.fatigue11 ?? '—'} · 21:00 fatigue: ${d.fatigue21 ?? '—'} · CTL: ${d.ctl ?? '—'} · beers: ${d.beers ?? '—'} · sleep: ${d.sleep ?? '—'}h<br>${escapeHtml(d.training||'')}</div></div>`;
  }).join('') : '<div class="meta">No entries yet.</div>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function drawLine(canvas, series, minY, maxY, labelFn){
  const ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height, pad=32;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#d1d5db'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const y=pad+(H-2*pad)*i/5;
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke();
  }
  ctx.fillStyle='#6b7280'; ctx.font='11px -apple-system';
  for(let i=0;i<=5;i++){
    const val=(maxY-(maxY-minY)*i/5).toFixed(0);
    ctx.fillText(val,5,pad+(H-2*pad)*i/5+4);
  }
  if(!series.length) return;
  const n=Math.max(1,series.length-1);
  series.forEach((s,si)=>{
    ctx.strokeStyle = si===0 ? '#111827' : '#6b7280';
    ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth=2;
    ctx.beginPath();
    s.values.forEach((p,i)=>{
      if(p.v==null) return;
      const x=pad+(W-2*pad)*(i/n);
      const y=pad+(H-2*pad)*(1-(p.v-minY)/(maxY-minY));
      if(i===0 || s.values.slice(0,i).every(q=>q.v==null)) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    s.values.forEach((p,i)=>{
      if(p.v==null) return;
      const x=pad+(W-2*pad)*(i/n);
      const y=pad+(H-2*pad)*(1-(p.v-minY)/(maxY-minY));
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
    });
  });
  ctx.fillStyle='#6b7280';
  const vals=series[0].values;
  if(vals.length){
    ctx.fillText(labelFn(vals[0].date),pad,H-8);
    const txt=labelFn(vals[vals.length-1].date); ctx.fillText(txt,W-pad-ctx.measureText(txt).width,H-8);
  }
}
function drawCharts(){
  const all=loadAll(), dates=Object.keys(all).sort().slice(-30);
  const f11=dates.map(date=>({date,v:all[date].fatigue11}));
  const f21=dates.map(date=>({date,v:all[date].fatigue21}));
  drawLine(els('fatigueChart'),[{values:f11},{values:f21}],0,10,d=>d.slice(5));
  const ctls=dates.map(date=>({date,v:all[date].ctl}));
  const present=ctls.map(x=>x.v).filter(v=>v!=null);
  let min=present.length?Math.floor(Math.min(...present)-5):0, max=present.length?Math.ceil(Math.max(...present)+5):60;
  if(max<=min){max=min+10}
  drawLine(els('ctlChart'),[{values:ctls}],min,max,d=>d.slice(5));
}
renderHistory(); drawCharts();

function download(filename, text, type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}
els('exportBtn').addEventListener('click',()=>download('fatigue-tracker-backup.json',JSON.stringify(loadAll(),null,2),'application/json'));
els('csvBtn').addEventListener('click',()=>{
  const all=loadAll(), rows=[['date','fatigue11','fatigue21','ctl','beers','sleep_hours','training']];
  Object.keys(all).sort().forEach(date=>{const d=all[date];rows.push([date,d.fatigue11??'',d.fatigue21??'',d.ctl??'',d.beers??'',d.sleep??'',d.training??''])});
  const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
  download('fatigue-tracker.csv',csv,'text/csv');
});
els('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{try{saveAll(JSON.parse(r.result));renderHistory();drawCharts();alert('Imported.')}catch(err){alert('That file could not be imported.')}}; r.readAsText(f);
});
els('clearBtn').addEventListener('click',()=>{
  if(confirm('Delete all saved fatigue tracker data from this device?')){localStorage.removeItem(KEY);loadDay(els('date').value);renderHistory();drawCharts();}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{})}
</script>
</body>
</html>
